<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#143e35">
  <title>Вход · Retro Milliy</title>
  <link rel="stylesheet" href="/static/login.css">
  <script src="/static/i18n-uz.js" defer></script><script src="/static/i18n.js" defer></script><script src="/static/login.js" defer></script>
</head>
<body>
  <main class="login-card">
  <div class="lang-switch" role="group" aria-label="Til / Язык"><button type="button" class="lang-button" data-lang="ru" aria-pressed="true">РУ</button><button type="button" class="lang-button" data-lang="uz" aria-pressed="false">UZ</button></div>
    <div class="brand" aria-label="Retro Milliy"><span>R<span>✦</span></span></div>
    <p class="eyebrow">РАБОЧЕЕ ПРОСТРАНСТВО</p>
    <h1>Вход в Retro Milliy</h1>
    <p class="subtitle">Введите логин и пароль своей панели.</p>
    <form id="login-form">
      <label for="username">Логин</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">Войти</button>
    </form>
    <p id="error" class="error" role="alert" aria-live="polite"></p>
  </main>
</body>
</html>
